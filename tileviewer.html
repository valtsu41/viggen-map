<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        #map {
            margin: auto;
            width: 381px;
            height: 512px;
            /*width: 762px;
            height: 1024px;*/
        }
    </style>

</head>

<body>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([59.3, 14.4], 6);
        const normLayer = L.tileLayer('tiles-norm/{z}/{x}/{y}.png', {
            minZoom: 6,
            maxZoom: 10,
            bounds: [
                [53.0, 4.0],
                [72.0, 32.0]
            ]
        }).addTo(map);
        const maxLayer = L.tileLayer('tiles-max/{z}/{x}/{y}.png', {
            minZoom: 6,
            maxZoom: 10,
            bounds: [
                [53.0, 4.0],
                [72.0, 32.0]
            ]
        }).addTo(map);
        const layerControl = new L.Control.Layers({
            "NORM": normLayer,
            "MAX": maxLayer
        }).addTo(map)
    </script>
</body>

</html>
